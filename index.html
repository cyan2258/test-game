<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一个简洁、响应式的 2048 数字合成小游戏" />
    <title>2048 · 数字合成</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">NUMBER PUZZLE</p>
          <h1>2048</h1>
          <p class="subtitle">合并相同数字，挑战更高分数。</p>
        </div>
        <div class="score-panel" aria-label="游戏分数">
          <div class="score-card">
            <span>分数</span>
            <strong id="score">0</strong>
          </div>
          <div class="score-card best-card">
            <span>最高分</span>
            <strong id="best-score">0</strong>
          </div>
        </div>
      </header>

      <section class="control-row" aria-label="游戏控制">
        <p class="tip">使用方向键 / WASD 移动方块</p>
        <button id="new-game" class="new-game-button" type="button">新游戏</button>
      </section>

      <section class="game-container">
        <div id="game-board" class="game-board" role="grid" aria-label="2048 游戏棋盘"></div>
        <div id="game-message" class="game-message" hidden>
          <div class="message-card">
            <h2 id="message-title">游戏结束</h2>
            <p id="message-text">没有更多移动了。</p>
            <button id="try-again" class="new-game-button" type="button">再玩一次</button>
          </div>
        </div>
      </section>

      <footer class="footer-note">
        <p>目标：合成 <strong>2048</strong> 方块。每次移动都会出现一个新的数字。</p>
        <p class="made-with">保持专注，享受每一次合并。</p>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
